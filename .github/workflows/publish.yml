name: pipeline

on:
  pull_request:
    types:
      - closed

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: checkout ecodev_core
        uses: actions/checkout@v4
        with:
          token: ${{secrets.LIB_TOKEN}}

      - name: install and configure poetry
        run: |
          python3 -m pip install poetry
          poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}


      - name: commit new version
        run: |
          poetry version patch && poetry build && poetry publish
          lib_version=$(head pyproject.toml | grep version | cut -d\" -f 2 )
          git add pyproject.toml
          git config user.email "ci@se.com"
          git config user.name "<bot>"
          git commit -m "release $lib_version [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
